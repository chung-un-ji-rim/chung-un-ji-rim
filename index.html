<!DOCTYPE html>

<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청운지림</title>
</head>

<body>
    <h1 style="color: blue;">청운지림</h1>
    <p>안녕하세요, 청운지림입니다!</p>
<button id='CheckLoginStatus'>로그인 상태 확인</button>
<button id="myButton" onclick="alert('Hello, World!')">Click Me</button>

    <h2>회원가입</h2>
    <form method="POST" action="/signup" id="SignupForm">
        <input type="text" name="username" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">가입하기</button>
    </form>

    <h2>로그인</h2>
    <form method="POST" action="/login" id="LoginForm">
        <input type="text" name="username" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>

    <h2>로그아웃</h2>
    <form id="LogoutForm">
        <button type="submit">로그아웃</button>
    </form>

    <form id="PostForm">
        <input type="text" name="title" placeholder="글 제목" required> 
        <textarea name="content" placeholder="글 내용" required></textarea>
        <select name="category" required>
            <option value="">대분야 선택</option>
            <option value="선택 안 함">선택 안 함</option>
            <option value="철학·사상">철학·사상</option>
            <option value="역사·문명">역사·문명</option>
            <option value="언어·문학">언어·문학</option>
            <option value="사회">사회</option>
            <option value="정치·법">정치·법</option>
            <option value="경제·경영">경제·경영</option>
            <option value="수학·논리">수학·논리</option>
            <option value="자연과학">자연과학</option>
            <option value="생명·의학">생명·의학</option>
            <option value="기술·공학">기술·공학</option>
            <option value="예술·창작">예술·창작</option>
            <option value="생활·라이프스타일">생활·라이프스타일</option>
            <option value="취미·여가">취미·여가</option>
            <option value="스포츠">스포츠</option>
</select>
        <input type="text" name="source" placeholder="출처 (선택사항)">
        <button type="submit">게시하기</button>
    </form>
    <div id="posts"></div>
    <script src="client.js"></script>
</body>

</html>
